name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (Node ${{ matrix.node }} / Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '22'
            python: '3.11'
          - node: '24'
            python: '3.13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements.lock
          npm ci --ignore-scripts
      - name: Check public repository boundary and privacy
        run: .venv/bin/python tools/check_repository.py --tracked
      - name: Build unsigned widget
        run: .venv/bin/python tools/package_app.py
      - name: JavaScript tests
        run: npm test
      - name: Syntax, compatibility and licence checks
        run: npm run check
      - name: Python tests
        run: .venv/bin/python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify reproducible unsigned build
        run: .venv/bin/python tools/check_reproducible.py
      - name: Validate source bundle
        run: .venv/bin/python tools/release.py

  browser:
    name: Browser layout
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements.lock
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Build preview
        run: .venv/bin/python tools/package_app.py
      - name: Check both capability layouts and remote navigation
        run: .venv/bin/python tools/run_browser_checks.py
